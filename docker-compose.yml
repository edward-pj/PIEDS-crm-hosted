# The whole stack in one step:  docker compose up --build
#
# Compose reads the repo-root .env automatically, so every ${VAR} below comes
# from there. Values set under `environment:` win over whatever a container's
# .env would say, which is what lets the same .env serve laptops and containers.
services:
  # Local development only. Behind a profile so that pointing DATABASE_URL at
  # Supabase does not also leave an unused database running beside it.
  # `COMPOSE_PROFILES=localdb` in .env turns it on; .env.example ships with it.
  postgres:
    profiles: ["localdb"]
    image: postgres:16
    container_name: ignite_crm_pg
    environment:
      POSTGRES_USER: ignite
      POSTGRES_PASSWORD: ignite
      POSTGRES_DB: ignite_crm
    ports:
      # Host-side port only. Tests and `manage.py` runs from the host expect
      # 5432; set PG_HOST_PORT if another project already owns it.
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - ignite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignite -d ignite_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The CRM. The only process in this file that gets DATABASE_URL.
  crm:
    build:
      context: .
      dockerfile: Dockerfile
    image: ignite-crm
    container_name: ignite_crm_web
    # No depends_on: `postgres` is profiled and may legitimately not exist at
    # all. The entrypoint's own pg_isready loop waits for whatever DATABASE_URL
    # names, which covers the hosted case too -- something depends_on cannot.
    environment:
      # `postgres` is the compose service name, not localhost -- each container
      # has its own loopback.
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://ignite:ignite@postgres:5432/ignite_crm}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-do-not-use-in-prod}
      # True by default because DEBUG=False turns on SECURE_SSL_REDIRECT, which
      # would bounce plain-http://localhost:8000 to https and appear "broken".
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      # `crm` is appended rather than defaulted: the agent container reaches the
      # CRM by that hostname and Django validates the Host header, so a .env
      # that lists only localhost must not be able to drop it.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},crm
      # Batch 2025 signs in with Google. A WEB OAuth client, not the DESKTOP
      # one the agent uses for Gmail. Blank disables that door with a message.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_HOSTED_DOMAIN: ${GOOGLE_OAUTH_HOSTED_DOMAIN:-pilani.bits-pilani.ac.in}
      # The server holds each member's Gmail refresh token, encrypted with
      # this. Without it check_db fails the boot -- deliberately, because a CRM
      # that starts and then cannot send is worse than one that will not start.
      GMAIL_TOKEN_KEY: ${GMAIL_TOKEN_KEY:-}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-0}
      DB_TRANSACTION_POOLER: ${DB_TRANSACTION_POOLER:-False}
      # Both default to "whether DATABASE_URL is a local database" -- see the
      # header of docker/entrypoint-crm.sh. Left empty here so that logic runs;
      # set either to true/false to decide explicitly.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-}
      SEED_DEV: ${SEED_DEV:-}
    ports:
      - "8000:8000"
    # No entrypoint/command override. The image's CMD carries the full argv now
    # (see Dockerfile), so compose and the hosting platform start the container
    # identically -- which is the only way "it works in compose" means anything.
    # Overriding `entrypoint:` here would silently blank `command:` as well.

volumes:
  ignite_pgdata:
